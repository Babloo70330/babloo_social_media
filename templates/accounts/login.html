{% extends 'base.html' %}
{% block title %}Login - ConnectSphere{% endblock %}
{% block content %}
<div class="sw-card sw-auth-card">
    <h4 class="mb-3 text-center">Log in to ConnectSphere</h4>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="btn w-100" style="background: var(--sw-primary); color: #fff;">Log In</button>
    </form>
    <p class="text-center mt-3 mb-0">New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
</div>
{% endblock %}
