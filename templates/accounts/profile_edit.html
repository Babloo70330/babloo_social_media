{% extends 'base.html' %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="sw-card">
    <h5 class="mb-3">Edit Profile</h5>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="btn" style="background: var(--sw-primary); color:#fff;">Save Changes</button>
        <a href="{% url 'accounts:profile' username=user.username %}" class="btn sw-btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
